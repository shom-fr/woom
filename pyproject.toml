[project]
name = "woom"
description = "Workflow manager for ocean models"
authors = [
  {name = "Stephane Raynaud", email = "stephane.raynaud@shom.fr"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Distributed Computing",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Oceanography",
]
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.9"
dependencies = [
  "colorlog",
  "configobj",
  "jinja2",
  "pandas",
  "platformdirs",
  "psutil",
  "tabulate",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-mock",
  "pytest-xdist",
  "ruff",
  "pre-commit",
]
docs = [
  "ipython",
  "matplotlib",
  "sphinx",
  "sphinx-argparse",
  "sphinx-book-theme",
  "sphinxcontrib-programoutput",
]
test = [
  "pytest",
  "pytest-mock",
  "pytest-xdist",
]
monitor = [
  "flask",
]

[project.urls]
Homepage = "https://github.com/woom/woom"
Documentation = "https://woom.readthedocs.io"
Repository = "https://github.com/woom/woom"
"Bug Tracker" = "https://github.com/woom/woom/issues"

[project.scripts]
woom = "woom.cli:main"

[build-system]
requires = ["setuptools >= 64", "wheel", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["woom", "woom.monitor"]
include-package-data = true

[tool.setuptools.package-data]
woom = ["*.ini", "*.cfg", "templates/*"]
"woom.monitor" = ["static/*", "templates/*"]

[tool.setuptools_scm]
write_to = "woom/_version.py"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E203",  # whitespace before ':'
]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--showlocals",
    "--strict-markers",
    "--strict-config",
    "-W default",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (may require external resources)",
    "slow: Slow running tests",
    "requires_scheduler: Tests that require a real job scheduler",
    "smoke: Smoke tests (quick validation)",
    "regression: Regression tests",
    "wip: Work in progress tests (skip by default)",
]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_file = "tests/pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
source = ["woom"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/virtualenv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# Bandit configuration
[tool.bandit]
exclude_dirs = ["tests", "build", "dist", ".venv"]
tests = ["B201", "B301"]
skips = ["B101", "B601"]
