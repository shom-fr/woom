[hydro_model]
    [[content]]
    commandline=cat output/config_{{ cycle }}.nml

    [[fill]]
        [[[model_config]]]
        template=model.nml.j2
        destination=output/config_{{ cycle }}.nml

        [[[param_file]]]
        template=parameters.txt.j2
        destination=output/params_{{ cycle }}.txt
